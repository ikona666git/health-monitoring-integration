name: CI / Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore and build .NET
        run: |
          dotnet restore HealthMonitoring.slnx
          dotnet build HealthMonitoring.slnx --no-restore

      - name: Run unit tests
        run: dotnet test tests/UnitTests/UnitTests.csproj --no-build --verbosity normal

      - name: Install Python dependencies (ingestion)
        run: pip install -r module-ingestion/requirements.txt

      - name: Install Python dependencies (rules)
        run: pip install -r module-rules/requirements.txt

      - name: Install Node dependencies (alerting)
        run: npm install --omit=dev --prefix module-alerting

      - name: Docker Compose up
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5101/health && \
            curl -sf http://localhost:5102/health && \
            curl -sf http://localhost:3100/health && \
            curl -sf http://localhost:8180/ && exit 0
            sleep 2
          done
          echo "Services failed to start"
          docker compose logs
          exit 1

      - name: Integration test — full pipeline
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:5101/measurements \
            -H "Content-Type: application/json" \
            -d '{"user_id":"ci_user","metric_type":"heart_rate","value":135,"timestamp":"2026-06-07T12:00:00Z"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"accepted"'
          echo "$RESPONSE" | grep -q '"alert_triggered":true'
          echo "$RESPONSE" | grep -q '"alert_id"'

      - name: Run integration tests
        run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --verbosity normal

      - name: Run E2E tests
        run: dotnet test tests/E2ETests/E2ETests.csproj --verbosity normal

      - name: Docker Compose down
        if: always()
        run: docker compose down
